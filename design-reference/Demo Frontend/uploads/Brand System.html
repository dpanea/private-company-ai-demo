<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>Brand System — Daniel Panea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand/tokens.css?v=p4" />
  <style>
    body { background: var(--paper-50); }
    .doc {
      max-width: 1240px;
      margin: 0 auto;
      padding: 80px 56px 120px;
    }
    .doc-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--hairline);
    }
    .doc-head h1 {
      font-size: 84px;
      line-height: 0.95;
      letter-spacing: -0.025em;
    }
    .doc-head h1 em { font-style: normal; font-weight: 600; }
    .doc-head .meta {
      text-align: right;
      color: var(--fg-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.7;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .doc-intro {
      max-width: 720px;
      margin: 28px 0 0;
      font-size: 18px;
      line-height: 1.55;
      color: var(--ink-700);
    }
    .doc-intro em { font-family: var(--font-serif); font-style: normal; font-weight: 600; font-size: inherit; }

    section.block {
      margin-top: 96px;
    }
    section.block > .section-head {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 40px;
      align-items: baseline;
      margin-bottom: 32px;
    }
    section.block .num {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }
    section.block h2 {
      font-size: 40px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    section.block h2 em { font-style: normal; font-weight: 600; }
    section.block .section-note {
      grid-column: 2;
      max-width: 640px;
      color: var(--ink-700);
      margin-top: 12px;
      font-size: 15px;
    }

    /* —— Logo grid —— */
    .logo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--hairline);
      border: 1px solid var(--hairline);
    }
    .logo-cell {
      background: var(--bg-elev);
      padding: 56px 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-height: 280px;
      position: relative;
    }
    .logo-cell.dark { background: var(--ink-900); color: var(--paper-50); }
    .logo-cell .logo-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-cell .logo-foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 16px;
      border-top: 1px solid var(--hairline);
      margin-top: 24px;
    }
    .logo-cell.dark .logo-foot { border-top-color: rgba(255,255,255,0.12); }
    .logo-cell .logo-name {
      font-family: var(--font-serif);
      font-size: 18px;
    }
    .logo-cell .logo-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }
    .logo-cell.dark .logo-tag { color: var(--ink-300); }

    /* —— Color swatches —— */
    .swatch-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .swatch .chip {
      aspect-ratio: 1 / 1.1;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(10,26,47,0.06);
    }
    .swatch .chip.bordered { border: 1px solid var(--paper-300); }
    .swatch .label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .swatch .label .name { color: var(--ink-900); }
    .swatch .label .hex { color: var(--fg-muted); text-transform: lowercase; letter-spacing: 0.04em; }

    .accent-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    /* —— Type spec —— */
    .type-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--hairline);
      border: 1px solid var(--hairline);
    }
    .type-cell {
      background: var(--bg-elev);
      padding: 40px;
    }
    .type-cell .label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 24px;
    }
    .type-spec {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-muted);
      letter-spacing: 0.04em;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px dashed var(--hairline);
    }
    .type-spec span { white-space: nowrap; }
    .type-cell .specimen-display {
      font-family: var(--font-serif);
      font-size: 96px;
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    .type-cell .specimen-display em { font-style: normal; font-weight: 600; }
    .type-cell .specimen-h2 {
      font-family: var(--font-serif);
      font-size: 52px;
      line-height: 1.06;
      letter-spacing: -0.02em;
    }
    .type-cell .specimen-h2 em { font-style: normal; font-weight: 600; }
    .type-cell .specimen-body {
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.55;
      max-width: 480px;
      color: var(--ink-700);
    }
    .type-cell .specimen-mono {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-700);
    }

    /* Components */
    .comp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }
    .comp {
      background: var(--bg-elev);
      border: 1px solid var(--hairline);
      padding: 32px;
    }
    .comp .label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 0;
      border-radius: 0;
      transition: all 200ms ease;
      letter-spacing: -0.005em;
    }
    .btn-primary {
      background: var(--ink-900);
      color: var(--paper-50);
    }
    .btn-primary:hover { background: var(--ink-700); }
    .btn-ghost {
      background: transparent;
      color: var(--ink-900);
      border: 1px solid var(--ink-900);
    }
    .btn-ghost:hover { background: var(--ink-900); color: var(--paper-50); }
    .btn-link {
      background: transparent;
      color: var(--ink-900);
      padding: 14px 0;
      border-bottom: 1px solid var(--ink-900);
      border-radius: 0;
    }
    .btn .arrow { display: inline-block; transition: transform 200ms ease; }
    .btn:hover .arrow { transform: translateX(4px); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--ink-700);
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--ink-900); }

    .service-card {
      border-top: 1px solid var(--ink-900);
      padding-top: 20px;
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 16px;
      max-width: 420px;
    }
    .service-card .num {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-900);
      letter-spacing: 0.1em;
    }
    .service-card h4 {
      font-family: var(--font-serif);
      font-size: 26px;
      letter-spacing: -0.015em;
      margin-bottom: 12px;
      line-height: 1.05;
    }
    .service-card p {
      color: var(--ink-700);
      font-size: 14px;
      line-height: 1.55;
    }

    /* Photo treatment */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .photo-frame {
      position: relative;
      background: var(--ink-900);
      aspect-ratio: 4/5;
      overflow: hidden;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-frame .frame-meta {
      position: absolute;
      left: 16px;
      bottom: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--paper-50);
      mix-blend-mode: difference;
    }
    .photo-frame.duotone img {
      filter: grayscale(1) contrast(1.05);
    }
    .photo-frame.duotone::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,26,47,0.4), rgba(10,26,47,0.7));
      mix-blend-mode: multiply;
    }

    /* Brand voice */
    .voice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }
    .voice-card {
      padding: 32px;
      background: var(--bg-elev);
      border: 1px solid var(--hairline);
    }
    .voice-card.do-card { border-left: 3px solid var(--ink-900); }
    .voice-card.dont-card { border-left: 3px solid var(--accent-clay); opacity: 0.92; }
    .voice-card h4 {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .voice-card ul { list-style: none; padding: 0; margin: 0; }
    .voice-card li {
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.45;
      padding: 12px 0;
      border-bottom: 1px solid var(--hairline);
      color: var(--ink-700);
    }
    .voice-card li:last-child { border-bottom: 0; }
    .voice-card li em { font-style: normal; font-weight: 600; }
    .voice-card.dont-card li { text-decoration: line-through; text-decoration-color: rgba(194,90,60,0.5); text-decoration-thickness: 1px; }

  </style>
</head>
<body>

  <script type="text/babel" src="brand/brand-doc-app.jsx"></script>
</body>
</html>
