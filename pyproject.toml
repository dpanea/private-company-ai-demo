[project]
name = "company-ai"
version = "0.1.0"
description = "The Company Knowledge AI — public demo and reference architecture for a private, source-backed AI assistant over company knowledge."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "pydantic>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
company-ai = "company_ai.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not live'"
markers = [
    "requires_tesseract: tests that require local Tesseract and Poppler binaries",
    "live: hits the real configured LLM endpoint; requires COMPANY_AI_LIVE_LLM=1",
]
