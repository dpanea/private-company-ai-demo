[project]
name = "private-company-ai-demo"
version = "0.1.0"
description = "Public demo and open-source reference architecture for a private company memory layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "pydantic>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
pcad = "pcad.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "requires_tesseract: tests that require local Tesseract and Poppler binaries",
]
