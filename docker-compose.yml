services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pcad
      POSTGRES_PASSWORD: pcad
      POSTGRES_DB: pcad
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcad -d pcad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
