<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Future video walkthrough placeholder</title>
  <desc id="desc">A placeholder panel for a future demo walkthrough video.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a2f"/>
      <stop offset="1" stop-color="#1b3252"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      .mono { font: 500 13px IBM Plex Mono, ui-monospace, monospace; letter-spacing: 2px; }
      .title { font: 300 56px IBM Plex Sans, Inter, system-ui, sans-serif; }
      .copy { font: 400 22px IBM Plex Sans, Inter, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="620" rx="0" fill="#f7f4ee"/>
  <rect x="74" y="64" width="1292" height="492" rx="10" fill="url(#paper)" filter="url(#soft)"/>
  <rect x="116" y="112" width="1208" height="396" rx="8" fill="#ffffff" opacity=".06" stroke="#efeae0" stroke-opacity=".22"/>

  <g transform="translate(620 210)">
    <circle cx="100" cy="100" r="92" fill="#f7f4ee" opacity=".95"/>
    <path d="M82 61 L82 139 L148 100 Z" fill="#0a1a2f"/>
  </g>

  <text x="164" y="165" class="mono" fill="#b6bfcc">WALKTHROUGH VIDEO SLOT</text>
  <text x="164" y="414" class="title" fill="#ffffff">Record the live demo here</text>
  <text x="164" y="456" class="copy" fill="#d7dde6">Replace this placeholder with a short GIF, MP4, or linked recording once the hosted demo is ready.</text>
</svg>
