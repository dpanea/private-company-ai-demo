services:
  postgres:
    extends:
      file: ../../docker-compose.yml
      service: postgres

  vllm:
    image: vllm/vllm-openai:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    command: >
      --model ${LLM_MODEL_VLLM}
      --dtype ${VLLM_DTYPE:-bfloat16}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --max-num-batched-tokens ${VLLM_MAX_NUM_BATCHED_TOKENS:-2048}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      --kv-cache-dtype ${VLLM_KV_CACHE_DTYPE:-auto}
      --enable-prefix-caching
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-4}
      --host 0.0.0.0
      --port 8080
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    shm_size: "8gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    extends:
      file: ../../docker-compose.yml
      service: app
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_healthy
    environment:
      LLM_BASE_URL: http://vllm:8080/v1
      LLM_API_KEY: ${LLM_API_KEY:-local}
      LLM_MODEL: ${LLM_MODEL_VLLM}

volumes:
  postgres_data:
  rendered_data:
  huggingface_cache:
